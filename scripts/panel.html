<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>后台任务</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--surface:#fff;--ink:#182029;--muted:#68727e;--border:#e4e8ed;--accent:#3165d9;--soft:#edf3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1160px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:26px;margin:0 0 4px;letter-spacing:-.8px}.muted{color:var(--muted)}button,select,input{font:inherit;border:1px solid var(--border);border-radius:9px;padding:8px 12px;background:var(--surface);color:var(--ink)}button{cursor:pointer}button:hover{border-color:var(--accent)}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}.stat span{display:block;white-space:nowrap;font-size:12px;letter-spacing:-.2px}.stat strong{display:block;font-size:32px;letter-spacing:-1px;margin-top:4px}.active strong{color:var(--accent)}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{flex:1;min-width:0}.list{display:grid;gap:10px}.task{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}.task-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.badge{border-radius:6px;font-size:12px;padding:3px 8px;background:#edf0f3;color:#596571;white-space:nowrap}.badge.running,.badge.starting{background:#eaf1ff;color:#2458c4}.badge.completed{background:#e9f6ee;color:#247442}.badge.failed,.badge.timed_out{background:#fff0ee;color:#b24431}.command{margin:0;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.meta{margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);overflow-wrap:anywhere}.details{margin-top:12px;font-size:12px;color:var(--muted)}summary{cursor:pointer}pre.output{margin-bottom:0;padding:12px;background:var(--bg);border-radius:8px;max-height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);font:12px/1.6 ui-monospace,Consolas,monospace}.empty{padding:48px 16px;border:1px dashed var(--border);border-radius:12px;text-align:center;color:var(--muted)}.error{padding:12px;border-radius:9px;background:#fff0ee;color:#b24431;margin:14px 0}.foot{margin-top:18px;color:var(--muted);font-size:12px}.hidden{display:none}@media(max-width:580px){main{padding:20px 14px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:26px}.stat span{font-size:12px}.task-top{align-items:flex-start}}@media(prefers-color-scheme:dark){:root{--bg:#15181d;--surface:#1e232b;--ink:#eef1f5;--muted:#9ca7b4;--border:#303844;--soft:#223457}.badge{background:#303844;color:#b9c2cd}.badge.running,.badge.starting{background:#243757;color:#a6c7ff}.badge.completed{background:#203f31;color:#9ed6b4}.badge.failed,.badge.timed_out,.error{background:#4a2928;color:#f0b2a6}}
</style></head><body><main>
<header><div><h1>后台任务</h1><div class="muted" id="subtitle">查看命令与执行状态</div></div><div class="controls"><select id="scope" aria-label="查看范围"><option value="chat">打开面板的聊天</option><option value="all">全部聊天</option></select><button id="refresh">刷新</button></div></header>
<section class="stats" aria-label="任务数量"><div class="stat active"><span>进行中</span><strong id="active">—</strong></div><div class="stat"><span>已完成</span><strong id="completed">—</strong></div><div class="stat"><span>失败 / 超时</span><strong id="failed">—</strong></div><div class="stat"><span>任务总数</span><strong id="total">—</strong></div></section>
<div class="toolbar"><input id="search" type="search" placeholder="搜索命令或工作目录" aria-label="搜索任务"><select id="filter" aria-label="任务状态"><option value="all">全部状态</option><option value="active">正在执行</option><option value="completed">已完成</option><option value="failed">失败 / 超时</option><option value="cancelled">已取消</option></select></div>
<div id="error" class="error hidden" role="alert"></div><section id="tasks" class="list" aria-live="polite"><div class="empty">正在读取任务…</div></section><div class="foot" id="chat-note"></div><div class="foot" id="updated">每 2 秒自动刷新。仅显示通过本插件启动的任务。</div>
</main><script>
// The local server sets an HttpOnly session cookie; users never enter a token.
if(location.hash)history.replaceState(null,'',location.pathname+location.search);
const $=id=>document.getElementById(id);
const nativeMode=false;
const requestedSession=nativeMode?null:(new URLSearchParams(location.search).get('session_id')||new URLSearchParams(location.search).get('thread_id'));
if(requestedSession){const option=document.createElement('option');option.value='thread:'+requestedSession;option.textContent='指定聊天：'+requestedSession;option.selected=true;$('scope').append(option)}
function rememberScope(){if(nativeMode)return;const url=new URL(location.href),selection=$('scope').value;url.searchParams.delete('thread_id');url.searchParams.delete('session_id');url.searchParams.delete('scope');if(selection.startsWith('thread:'))url.searchParams.set('session_id',selection.slice(7));else if(selection==='all')url.searchParams.set('scope','all');history.replaceState(null,'',url.pathname+url.search)}
if(!nativeMode&&!requestedSession&&new URLSearchParams(location.search).get('scope')==='all')$('scope').value='all';
const names={starting:'启动中',running:'运行中',completed:'已完成',failed:'失败',timed_out:'超时',cancelled:'已取消'};
const notifications={sent:'通知已发送',pending:'等待完成通知',sending:'正在发送通知',disabled:'未开启通知',failed_or_unknown:'通知失败或状态未知',not_sent:'通知未发送'};
let data=null,busy=false,lastSignature='',openDetails=new Set(),requestNumber=0,chats=new Map(),lastChatRefresh=0;
async function loadChats(force=false){if(!force&&Date.now()-lastChatRefresh<30000)return;lastChatRefresh=Date.now();try{const response=await fetch('/api/chats',{cache:'no-store'});if(!response.ok)throw Error('无法读取聊天列表');const result=await response.json();chats=new Map(result.chats.map(c=>[c.id,c]));lastSignature='';const selected=$('scope').value,fragment=document.createDocumentFragment();fragment.append(element('option','', '打开面板的聊天'),element('option','', '全部聊天'));const origin=result.chats.find(c=>c.current);fragment.children[0].textContent='打开面板的聊天：'+(origin?.title||origin?.id?.slice(0,8)||'未知');fragment.children[0].value='chat';fragment.children[1].value='all';for(const chat of result.chats){const option=element('option','',(chat.title||'聊天 '+chat.id.slice(0,8))+' · '+chat.active+' 运行 / '+chat.total+' 任务');option.value='thread:'+chat.id;option.title=chat.cwd||chat.id;fragment.append(option)}if(selected.startsWith('thread:')&&!result.chats.some(c=>'thread:'+c.id===selected)){const missing=element('option','','指定聊天（未找到）：'+selected.slice(7));missing.value=selected;fragment.append(missing)}$('scope').replaceChildren(fragment);if([...$('scope').options].some(o=>o.value===selected))$('scope').value=selected;$('chat-note').textContent='浏览器面板不会自动跟随 Codex 切换聊天。 '+result.note+(result.error?' 聊天列表暂时无法更新，使用已有记录。':'');render()}catch(error){$('chat-note').textContent='聊天列表暂时无法读取，仍可查看打开面板的聊天或全部聊天的任务。'}}
function element(tag,className,text){const e=document.createElement(tag);if(className)e.className=className;if(text!==undefined)e.textContent=text;return e}
function elapsed(task){if(task.duration_seconds!==null&&task.duration_seconds!==undefined)return task.duration_seconds.toFixed(1)+' 秒';if(task.started_at){return Math.max(0,(Date.now()-Date.parse(task.started_at))/1000).toFixed(0)+' 秒'}return '等待启动'}
function render(){if(!data)return;for(const key of ['active','completed','failed','total'])$(key).textContent=data.counts[key];
const query=$('search').value.toLowerCase(),filter=$('filter').value;
const visible=data.tasks.filter(t=>(!query||(t.command+' '+(t.cwd||'')).toLowerCase().includes(query))&&(filter==='all'||(filter==='active'?['starting','running'].includes(t.status):filter==='failed'?['failed','timed_out'].includes(t.status):t.status===filter)));
const signature=JSON.stringify([visible,$('scope').value,query,filter]);
if(signature!==lastSignature){lastSignature=signature;const items=document.createDocumentFragment();
for(const task of visible){const card=element('article','task'),top=element('div','task-top');top.append(element('span','badge '+task.status,names[task.status]||task.status),element('span','muted',elapsed(task)));card.append(top,element('pre','command',task.command));
const meta=element('div','meta');meta.append(element('span','',task.cwd||''),element('span','',task.exit_code===null||task.exit_code===undefined?'退出码 —':'退出码 '+task.exit_code),element('span','',notifications[task.notification_status]||task.notification_status||''));card.append(meta);
const details=element('details','details');details.open=openDetails.has(task.task_id);details.addEventListener('toggle',()=>details.open?openDetails.add(task.task_id):openDetails.delete(task.task_id));details.append(element('summary','', '查看输出和任务信息'));
const info=element('div','meta');info.append(element('span','',task.task_id),element('span','', chats.get(task.thread_id)?.title||'聊天 '+task.thread_id.slice(0,8)),element('span','',task.created_at?new Date(task.created_at).toLocaleString('zh-CN'):''));details.append(info);
if(task.output_truncated)details.append(element('div','', '输出过长，以下显示末尾内容。'));
details.append(element('pre','output',[task.output_tail||'暂无输出',task.error,task.notification_error].filter(Boolean).join('\n')));card.append(details);items.append(card)}
if(!visible.length)items.append(element('div','empty',data.counts.total?'没有匹配的任务':'当前范围还没有后台任务'));$('tasks').replaceChildren(items)}else{document.querySelectorAll('.task-top .muted').forEach((e,i)=>e.textContent=elapsed(visible[i]))}
$('subtitle').textContent=$('scope').value==='chat'?'打开面板的聊天：'+(chats.get(data.thread_id)?.title||data.thread_id):$('scope').value==='all'?'此设备上全部聊天的后台命令':(chats.get($('scope').value.slice(7))?.title||data.thread_id)+'的后台命令';
$('updated').textContent='每 2 秒自动刷新 · 更新于 '+new Date(data.updated_at).toLocaleTimeString('zh-CN')+' · 仅显示通过本插件启动的任务'+(data.unreadable_records?' · '+data.unreadable_records+' 条记录无法读取':'');}
async function refresh(force=false){if(busy&&!force)return;const number=++requestNumber;busy=true;try{const selection=$('scope').value;const query=selection.startsWith('thread:')?'scope=thread&thread_id='+encodeURIComponent(selection.slice(7)):'scope='+selection;const response=await fetch('/api/tasks?'+query,{cache:'no-store'});if(!response.ok)throw Error(response.status===404?'找不到指定的 session ID，请从下拉框选择聊天。':'读取失败（'+response.status+'），请重新打开面板。');const result=await response.json();if(number!==requestNumber)return;data=result;$('error').classList.add('hidden');render()}catch(error){if(number!==requestNumber)return;$('error').textContent='无法更新：'+error.message;$('error').classList.remove('hidden')}finally{if(number===requestNumber)busy=false}}
$('refresh').addEventListener('click',()=>{loadChats(true);refresh(true)});$('scope').addEventListener('change',()=>{rememberScope();lastSignature='';openDetails.clear();refresh(true)});$('search').addEventListener('input',render);$('filter').addEventListener('change',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(()=>{if(!document.hidden){refresh();loadChats()}},2000);refresh();loadChats();
</script></body></html>
